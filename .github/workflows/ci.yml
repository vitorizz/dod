name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Postgres with pgvector, for the PostgresStore and demo-on-Postgres tests.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: dod
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DOD_TEST_POSTGRES_URI: postgresql://postgres:dod@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # With the real integration packages, so the CrewAI, LangGraph, cross-store
      # and quickstart tests run here instead of skipping.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,crewai,langgraph,langchain,anthropic,otel,mcp,pydantic_ai,postgres,mem0,openai_agents]"

      - name: Run pytest
        env:
          MEM0_TELEMETRY: "False"
        run: pytest -q

  # The core library must work with no integration installed.
  test-core:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest without integrations
        run: pytest -q

  # Docs-only PRs (every changed file is Markdown or under docs/) skip the review.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[].filename')
          if printf '%s\n' "$files" | grep -qEv '(^docs/|\.md$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Docs-only PR; skipping Claude Code Review."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # Review only after tests pass, so failing PRs don't spend review tokens.
  review:
    needs: [test, changes]
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/claude-code-review.yml
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    secrets: inherit
