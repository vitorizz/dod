name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned, labeled]
  pull_request_review:
    types: [submitted]

jobs:
  # Moves the issue to "In progress" when Claude starts on it (issues only, not PRs).
  # Keep these event conditions in sync with the claude job below.
  board:
    if: |
      github.event.issue && !github.event.issue.pull_request && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'agent-ready') ||
        (github.event_name == 'issues' && github.event.action != 'labeled' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    uses: ./.github/workflows/project-board.yml
    with:
      issue_number: ${{ github.event.issue.number }}
      status: In progress
    secrets: inherit

  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'agent-ready') ||
      (github.event_name == 'issues' && github.event.action != 'labeled' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Claude opens PRs with gh pr create
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Issues labeled agent-ready trigger Claude without an @claude mention
          label_trigger: agent-ready

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Claude can run tests and open the PR itself, linked to the issue
          claude_args: |
            --model claude-sonnet-5
            --allowedTools "Bash(pip install *),Bash(pytest *),Bash(gh pr create:*)"
            --append-system-prompt "When you finish work on an issue, push your branch and open the pull request yourself with gh pr create. The PR body must include 'Closes #N', where N is the issue number, so the PR is linked to the issue and closes it on merge."

      # The action's built-in tag-mode prompt tells Claude to post a "Create PR" link
      # instead of opening one, so open it here. Uses PAT_TOKEN, not GITHUB_TOKEN:
      # PRs opened with GITHUB_TOKEN don't trigger CI or the review workflow.
      - name: Open PR for Claude's branch
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.repository.default_branch }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::PAT_TOKEN secret is not set"; exit 1
          fi
          # Branches are claude/issue-<N>-<YYYYMMDD-HHMM>; newest sorts last.
          branch=$(gh api "repos/$REPO/git/matching-refs/heads/claude/issue-$ISSUE_NUMBER-" \
            --jq '.[].ref' | sed 's#^refs/heads/##' | sort | tail -n 1)
          if [ -z "$branch" ]; then
            echo "No claude/issue-$ISSUE_NUMBER-* branch; Claude made no changes."; exit 0
          fi
          ahead=$(gh api "repos/$REPO/compare/$BASE...$branch" --jq '.ahead_by')
          if [ "$ahead" = "0" ]; then
            echo "$branch has no commits ahead of $BASE; nothing to open."; exit 0
          fi
          existing=$(gh pr list --repo "$REPO" --head "$branch" --state all --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            echo "PR #$existing already exists for $branch."; exit 0
          fi
          body="Closes #$ISSUE_NUMBER

          Opened automatically from \`$branch\` after Claude worked on #$ISSUE_NUMBER.

          🤖 Generated with [Claude Code](https://claude.com/claude-code)"
          gh pr create --repo "$REPO" --base "$BASE" --head "$branch" \
            --title "$ISSUE_TITLE" --body "$body"
