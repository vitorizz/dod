name: Claude Code Review

# Called from ci.yml after the test job passes, and only for PRs that change code
# (not docs-only). Runs in the caller's pull_request context.
on:
  workflow_call:

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Comments created before this point belong to earlier reviews.
      - name: Record review start time
        id: start
        run: echo "ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: claude
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are a strict reviewer for a memory-lineage capture library. Read CLAUDE.md first.
            Review this PR's diff (`gh pr diff`) and hold it to the bar below. Do not approve on vibes.

            1. Tests
               - Every new or changed behavior has a test. Missing tests is a blocking finding.
               - Run exactly `pip install -e ".[dev]"` then `pytest -q`, directly on the runner; report failures verbatim.
                 Don't create a venv or call pip/pytest through `python -m`: only these command forms are allowed.
               - Tests must assert behavior, not just that code runs.
            2. Edge cases
               - Empty/None parent_ids, duplicate writes, same content hash, unknown store, concurrent writes,
                 retrieval with no subsequent write, write with no preceding retrieval, cycles in trace/blast-radius.
               - Any write path that bypasses the capture hook is a blocking finding (capture completeness).
               - The ledger must stay append-only; flag any update/delete of existing edges.
            3. Capture overhead < 1 ms
               - Anything on the write/capture hot path must stay sub-millisecond: no network calls, no blocking
                 I/O beyond the append, no per-write schema/connection setup, no unbounded work.
               - If the PR touches the hot path, it must include or update a benchmark/test asserting p99 < 1 ms.
                 Missing benchmark is a blocking finding.
            4. CLAUDE.md conventions
               - Small, working increments over large scaffolds; flag speculative abstractions.
               - OpenTelemetry attributes use our own namespace, never `gen_ai.*`.
               - No claims or code implying automated detection of bad memories; we sell trace + excision.
               - Model-agnostic and store-agnostic: no hard dependency on one vendor in core code.
               - Instrumentation present for propagation experiments.

            Post specific issues as inline comments with `mcp__github_inline_comment__create_inline_comment`,
            then one summary with `gh pr comment` listing blocking vs. non-blocking findings.
            If there are no issues, say so explicitly and state what you checked.
            The summary comment must end with a final line of exactly `BLOCKING: <count>`, where <count> is the
            number of blocking findings (`BLOCKING: 0` if none). Automation reads this line.
          claude_args: '--model claude-sonnet-5 --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(pip install *),Bash(pytest *),Bash(python -m pytest *),Bash(python3 -m pytest *)"'

      # Reads the BLOCKING line from this run's summary and asks Claude to fix blocking items.
      # Capped at 3 automated fix rounds per PR, then hands off via needs-human.
      # Uses PAT_TOKEN: comments made with GITHUB_TOKEN don't trigger claude.yml.
      - name: Request fixes for blocking findings
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SINCE: ${{ steps.start.outputs.ts }}
          FIX_MSG: "@claude fix the blocking items in the latest review"
          MAX_ROUNDS: 3
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::PAT_TOKEN secret is not set"; exit 1
          fi
          bodies=$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.user.type == \"Bot\" and .created_at >= \"$SINCE\") | .body")
          count=$(printf '%s\n' "$bodies" | tr -d '\r' | grep -oE '^BLOCKING: [0-9]+$' | tail -n 1 | cut -d' ' -f2)
          if [ -z "$count" ]; then
            echo "::warning::No 'BLOCKING: <count>' line in this review's summary; skipping auto-fix."; exit 0
          fi
          echo "Blocking findings: $count"
          [ "$count" -gt 0 ] || exit 0
          rounds=$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" --jq '.[].body' \
            | tr -d '\r' | grep -cxF "$FIX_MSG" || true)
          echo "Previous automated fix rounds: $rounds"
          if [ "$rounds" -ge "$MAX_ROUNDS" ]; then
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body "Review still reports $count blocking finding(s) after $MAX_ROUNDS automated fix rounds. Handing off to a human."
            gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label needs-human
            exit 0
          fi
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$FIX_MSG"
