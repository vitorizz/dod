[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dod"
version = "0.1.0"
description = "A capture library for AI agents with long-lived memory: records which retrieved items were in context at every memory write, turning agent memory into a traceable lineage graph."
readme = "README.md"
requires-python = ">=3.9"

[project.optional-dependencies]
dev = ["pytest"]
crewai = ["crewai==1.15.22"]
langgraph = ["langgraph==1.2.14", "langgraph-checkpoint==4.2.0"]
anthropic = ["anthropic==1.12.1"]
langchain = ["langchain-core==1.7.5"]
otel = ["opentelemetry-api==1.45.1", "opentelemetry-sdk==1.45.1"]
mcp = ["mcp==1.28.1"]
pydantic_ai = ["pydantic-ai-slim==2.66.0"]
postgres = ["langgraph==1.2.14", "langgraph-checkpoint==4.2.0", "langgraph-checkpoint-postgres==3.1.2", "psycopg[binary]==3.3.8"]

[tool.pytest.ini_options]
markers = [
    "crewai: needs the real crewai package (pip install -e \".[crewai]\")",
    "langgraph: needs the langgraph package (pip install -e \".[langgraph]\")",
    "langchain: needs langchain-core (pip install -e \".[langchain]\")",
    "anthropic: needs the anthropic package (pip install -e \".[anthropic]\")",
    "otel: needs the OpenTelemetry API and SDK (pip install -e \".[otel]\")",
    "mcp: needs the MCP SDK (pip install -e \".[mcp]\")",
    "pydantic_ai: needs pydantic-ai-slim (pip install -e \".[pydantic_ai]\")",
    "postgres: needs a Postgres server (DOD_TEST_POSTGRES_URI) and pip install -e \".[postgres]\"",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dod"]
